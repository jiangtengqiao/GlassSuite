services:
  netease-cloud-music-api:
    image: binaryify/netease-cloud-music-api:latest
    container_name: cloudmusic-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # 可选：指定真实 IP 用于部分接口风控规避
      # - REAL_IP=127.0.0.1
      # 可选：限制匿名访问
      # - ANONYMOUS_TOKEN=
