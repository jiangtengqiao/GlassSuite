name: Release

# 打 tag 即发布：git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 安装 Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" >/dev/null 2>&1 || true
      - name: 构建 Release APK（未签名）
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows:
    name: Windows 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 发布（win-x64，框架依赖）
        run: |
          dotnet publish windows/src/CloudMusic/CloudMusic.csproj -c Release -r win-x64 --self-contained false -o publish/CloudMusic-win-x64
      - name: 打包 ZIP
        run: Compress-Archive -Path publish/CloudMusic-win-x64 -DestinationPath publish/CloudMusic-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: publish/CloudMusic-win-x64.zip
          if-no-files-found: error

  harmony:
    name: HarmonyOS 源码包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包 HarmonyOS 工程源码
        run: |
          tar -czf harmony-source.tar.gz harmony
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-source
          path: harmony-source.tar.gz
          if-no-files-found: error

  release:
    name: 创建 GitHub Release
    needs: [android, windows, harmony]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 组装 Release
        run: |
          mkdir -p assets
          find artifacts -name "*.apk" -exec cp {} assets/ \;
          find artifacts -name "*.zip" -exec cp {} assets/ \;
          find artifacts -name "*.tar.gz" -exec cp {} assets/ \;
          ls -la assets/
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 乐云音乐 CloudMusic 发布说明

            - **Android**：`*.apk`（Release 未签名包，安装前请允许「未知来源」；正式分发请配置签名）
            - **Windows**：`CloudMusic-win-x64.zip`（win-x64，需安装 [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0)）
            - **HarmonyOS**：`harmony-source.tar.gz`（DevEco Studio 打开 `harmony/` 目录构建 HAP，需 API 12+ 与华为签名配置）

            ### 使用步骤
            1. 部署 API 服务：`cd server && docker compose up -d`（或源码运行，详见 README）
            2. 在应用「设置 → 服务器地址」配置 API 地址
            3. 扫码 / 验证码登录后即可使用

            > 仅供学习交流使用；音乐内容版权归网易云音乐及权利人所有。
