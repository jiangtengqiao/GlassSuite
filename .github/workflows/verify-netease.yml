name: verify-netease

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/verify-weapi.py']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: pip install pycryptodome -q
      - name: 网易云 weapi/eapi 协议验证
        run: python docs/verify-weapi.py
